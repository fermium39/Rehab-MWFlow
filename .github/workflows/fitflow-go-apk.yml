name: Build FitFlow Go APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'fitflow-go/**'
      - '.github/workflows/fitflow-go-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install image validation dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Validate and bundle offline website
        run: python3 fitflow-go/scripts/prepare_offline.py
      - name: Build debug APK
        working-directory: fitflow-go
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK includes offline content
        run: |
          python3 - <<'PY'
          import zipfile
          path='fitflow-go/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(path) as apk:
              paths=set(apk.namelist())
              mandatory=[
                  'assets/index.html',
                  'assets/assets/Logo/FitFlow-Logo.png',
                  'assets/assets/Equipment/Equipment_Kettlebell.png',
                  'assets/assets/S9-DeadBug.png',
                  'assets/assets/S14-SitToStand.png',
                  'assets/assets/S15-LowStepUp.png',
                  'assets/assets/M9-StandingWeightShift.png',
              ]
              missing=[p for p in mandatory if p not in paths]
              assert not missing, f"Missing bundled assets: {missing}"
              print(f'APK content verified, {len(paths)} entries')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fitflow-go-debug-apk
          path: fitflow-go/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
