name: Build FitFlow Go APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'fitflow-go/**'
      - '.github/workflows/fitflow-go-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle website and compressed images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,re
          dest=Path('fitflow-go/app/src/main/assets')
          dest.mkdir(parents=True,exist_ok=True)
          shutil.copytree('assets',dest/'assets',dirs_exist_ok=True)
          html=Path('index.html').read_text(encoding='utf-8')
          html=re.sub(r"<script>if\('serviceWorker' in navigator\).*?</script>",'',html,flags=re.S)
          html=html.replace('<title>FitFlow</title>','<title>FitFlow Go</title>')
          html=html.replace('<link rel="manifest" href="./manifest.webmanifest">','')
          html=html.replace('</body>','<script>document.addEventListener("DOMContentLoaded",()=>{const b=document.getElementById("checkUpdate");if(b)b.style.display="none";});</script></body>')
          (dest/'index.html').write_text(html,encoding='utf-8')
          assert (dest/'assets'/'Equipment'/'Equipment_Stair.png').exists(), 'Missing stair asset'
          PY
      - name: Build debug APK
        working-directory: fitflow-go
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fitflow-go-debug-apk
          path: fitflow-go/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
